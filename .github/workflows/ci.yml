# L0 + typecheck + skill validation on Linux, Windows and macOS; L2 e2e on
# Linux (Xvfb) and Windows only (macOS e2e stays local to save minutes).
# Chrome for Testing comes from `tabcap setup` and is cached by its version.
name: ci

on:
  push:
    branches: [main]
    paths-ignore: [NOTES.md]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  unit:
    name: unit (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: L0 unit tests
        run: bun test test/unit
      - name: typecheck
        run: bunx tsc --noEmit -p .
      - name: skill validation
        run: bun run validate:skill

  # native/wireprint (Zig): format check, offline tests, and a cross-compile of
  # the four release targets (artifacts are not uploaded yet). tabcap builds the
  # component only with -Dopenssl=false.
  native:
    name: native (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: native/wireprint
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig version
      - name: zig fmt
        run: zig fmt --check src
      - name: zig build test
        run: zig build test -Dopenssl=false --summary all
      - name: cross-compile (darwin-arm64, linux-x64, linux-arm64, windows-x64)
        run: |
          for t in aarch64-macos x86_64-linux aarch64-linux x86_64-windows; do
            start=$(date +%s)
            zig build -Dopenssl=false -Doptimize=ReleaseSafe -Dtarget="$t" --prefix "zig-out/$t"
            echo "$t: $(( $(date +%s) - start )) s"
            ls -l "zig-out/$t/bin"
          done

  e2e:
    name: e2e (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cft_cache: ~/.cache/tabcap/chrome
            # A screen wider than Chrome's default window (at most 1050 px wide at x=10),
            # so Xvfb's pointer (screen centre) is not over the page and sends no real mouse events.
            run_prefix: xvfb-run -a -s "-screen 0 2560x1440x24"
          - os: windows-latest
            cft_cache: ~/AppData/Local/tabcap/cache/chrome
            run_prefix: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    # Windows e2e is informative only (0.3-G, 3 fix rounds): 18 of 81 fail there
    # and cannot pass without changing assertions: tabcap.e2e.test.ts asserts the
    # Unix socket in its first test, so the 12 tests after it never get a browser;
    # 5 tests assert POSIX modes (0600 / 0700); `resize 900 700` gives a 693 px
    # high page. Listed as 待验 in NOTES.md.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    env:
      TABCAP_E2E: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Linux display and sandbox
        if: runner.os == 'Linux'
        run: |
          command -v xvfb-run >/dev/null || (sudo apt-get update -q && sudo apt-get install -y -q xvfb)
          # Ubuntu 23.10+ restricts unprivileged user namespaces, which Chrome's sandbox needs.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Chrome for Testing version
        id: cft
        run: |
          bun -e 'fetch("https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions-with-downloads.json").then((r) => r.json()).then((j) => console.log("version=" + j.channels.Stable.version))' >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"
      - name: Chrome for Testing cache
        uses: actions/cache@v4
        with:
          path: ${{ matrix.cft_cache }}
          key: cft-${{ runner.os }}-${{ steps.cft.outputs.version }}
      - name: tabcap setup (default directories)
        run: |
          start=$(date +%s)
          bun src/cli/main.ts setup | tee setup.json
          echo "setup took $(( $(date +%s) - start )) s"
          bun -e 'Bun.file("setup.json").json().then((j) => { if (!j.ok) process.exit(1); console.log("TABCAP_CHROME=" + j.data.executablePath); })' >> "$GITHUB_ENV"
      - name: platform probe (listener, CDP channel, windows, file locations)
        continue-on-error: true
        run: ${{ matrix.run_prefix }} bun scripts/ci-probe.ts 2>&1 | tee probe.log; exit ${PIPESTATUS[0]}
      - name: L2 e2e
        run: ${{ matrix.run_prefix }} bun test test/e2e --timeout 120000 2>&1 | tee e2e.log; exit ${PIPESTATUS[0]}
      - name: upload logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-${{ matrix.os }}
          path: |
            e2e.log
            probe.log
            setup.json
            ~/.config/tabcap/*.log
            ~/AppData/Local/tabcap/config/*.log
          if-no-files-found: ignore
          retention-days: 7
