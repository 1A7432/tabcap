# L0 + typecheck + skill validation on Linux, Windows and macOS; L2 e2e on
# Linux (Xvfb) and Windows only (macOS e2e stays local to save minutes), each in
# three shards of about equal time on separate runners (scripts/e2e-shard.ts,
# weights in test/e2e/timings.json). Commits that only touch NOTES, the
# changelogs or docs/ (except docs/04, which a unit test reads) skip CI.
# Chrome for Testing comes from `tabcap setup` and is cached by its version.
# Python (the generated replay client) only through uv: a warm-up step fills the
# uv cache with network, the tests then run uv offline.
# Flake hunting (workflow_dispatch with e2e_only): only the e2e job runs, on the
# chosen OS, the one test file e2e_repeat times with TABCAP_LOG=debug, its logs
# uploaded whether the runs pass or fail. Every e2e run sets TABCAP_E2E_KEEP:
# each test file's temp home leaves its daemon.log / browser.log (v04a also its
# bundles) in ci-logs/keep/<file>/ (test/e2e/_daemon.ts removeHome); ordinary
# shards run at TABCAP_LOG=info and upload them when the shard fails. Every e2e
# run also samples the runner's load into ci-logs/sampler.log (scripts/ci-sampler.ts).
name: ci

on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!NOTES.md"
      - "!CHANGELOG.md"
      - "!CHANGELOG.zh-CN.md"
      - "!docs/**"
      - "docs/04-evidence-bundle-spec-v0.md"
  pull_request:
    paths:
      - "**"
      - "!NOTES.md"
      - "!CHANGELOG.md"
      - "!CHANGELOG.zh-CN.md"
      - "!docs/**"
      - "docs/04-evidence-bundle-spec-v0.md"
  workflow_dispatch:
    inputs:
      e2e_only:
        description: "Flake hunting: run only this e2e test file (unit and native are skipped)"
        type: string
        default: ""
      e2e_repeat:
        description: "With e2e_only: how many times to run it"
        type: number
        default: 5
      e2e_os:
        description: "With e2e_only: on which OS"
        type: choice
        options: [windows-latest, ubuntu-latest, both]
        default: windows-latest

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  unit:
    name: unit (${{ matrix.os }})
    if: ${{ !inputs.e2e_only }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
        include:
          # windows-latest sometimes stalls a file-heavy unit test for several
          # seconds: in two runs on 2026-10-22 (39711577071, 39741072226) three
          # such tests took 5.6-7.6 s and tripped Bun's 5 s default, where the
          # same tests take 0.1-1.0 s on that runner when it is quiet (and under
          # 0.5 s on Linux / macOS). The cause is not known; the image already
          # runs Defender with real-time monitoring off and C:\ and D:\ excluded
          # (runner-images Configure-WindowsDefender.ps1), see the probe below.
          # 15 s is a ceiling for that platform, not a cure.
          - os: windows-latest
            unit_timeout: 15000
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: templates/python/pyproject.toml
      - name: uv cache warm-up (network; the Python runs in the tests are offline)
        run: |
          uv python install 3.13
          # Lock and install a throwaway package with the generated pyproject.toml, so the
          # tests' offline `uv sync` of each generated package finds every wheel and index
          # entry in the cache (a `uv pip install` warm-up does not serve an offline lock).
          mkdir .uv-warm
          sed 's/{{[A-Za-z]*}}/uv-warm/g' templates/python/pyproject.toml > .uv-warm/pyproject.toml
          uv sync --project .uv-warm --group test
          rm -rf .uv-warm
      - name: runner probe (Windows, Defender mode and exclusions)
        if: runner.os == 'Windows'
        # Diagnostic only, for the stalls described at the matrix: what Defender
        # is actually doing on the runner that ran this job. Best effort.
        continue-on-error: true
        shell: pwsh
        run: |
          Get-MpComputerStatus | Format-List AMRunningMode, RealTimeProtectionEnabled, OnAccessProtectionEnabled, IoavProtectionEnabled, BehaviorMonitorEnabled
          (Get-MpPreference).ExclusionPath
      - name: L0 unit tests
        run: bun test test/unit --timeout ${{ matrix.unit_timeout || 5000 }}
      - name: typecheck
        run: bunx tsc --noEmit -p .
      - name: skill validation
        run: bun run validate:skill

  # native/wireprint (Zig): format check, offline tests, and the four release
  # binaries tabcap embeds (native/dist/<target>/, this host's included), whose
  # host binary is run once.
  native:
    name: native (${{ matrix.os }})
    if: ${{ !inputs.e2e_only }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: native/wireprint
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig version
      - name: zig fmt
        run: zig fmt --check src
      - name: zig build test
        run: zig build test --summary all
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: wire binaries (native/dist, all four targets)
        working-directory: .
        run: |
          bun scripts/native.ts build
          ls -l native/dist/*/
      - name: host binary runs
        working-directory: .
        run: |
          case "${{ runner.os }}" in
            Linux) bin=native/dist/x86_64-linux-gnu/wireprint ;;
            Windows) bin=native/dist/x86_64-windows-gnu/wireprint.exe ;;
            macOS) bin=native/dist/aarch64-macos/wireprint ;;
          esac
          "$bin" version
          "$bin" ja4 native/wireprint/fixtures/clienthello/cft-155-macos-nav-1.bin

  e2e:
    name: e2e (${{ matrix.os }}, ${{ matrix.shard }}/${{ inputs.e2e_only && 1 || 3 }})
    strategy:
      fail-fast: false
      matrix:
        # Both, unless a flake hunt (e2e_only) picks one.
        os: ${{ fromJSON(inputs.e2e_only && inputs.e2e_os != 'both' && format('["{0}"]', inputs.e2e_os) || '["ubuntu-latest","windows-latest"]') }}
        # Three shards; a flake hunt runs its one file in a single job.
        shard: ${{ fromJSON(inputs.e2e_only && '[1]' || '[1,2,3]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ inputs.e2e_only && 60 || 20 }}
    env:
      TABCAP_E2E: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: templates/python/pyproject.toml
      - name: uv cache warm-up (network; the Python runs in the tests are offline)
        run: |
          uv python install 3.13
          # Lock and install a throwaway package with the generated pyproject.toml, so the
          # tests' offline `uv sync` of each generated package finds every wheel and index
          # entry in the cache (a `uv pip install` warm-up does not serve an offline lock).
          mkdir .uv-warm
          sed 's/{{[A-Za-z]*}}/uv-warm/g' templates/python/pyproject.toml > .uv-warm/pyproject.toml
          uv sync --project .uv-warm --group test
          rm -rf .uv-warm
      - name: Linux display and sandbox
        if: runner.os == 'Linux'
        run: |
          command -v xvfb-run >/dev/null || (sudo apt-get update -q && sudo apt-get install -y -q xvfb)
          # Ubuntu 23.10+ restricts unprivileged user namespaces, which Chrome's sandbox needs.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Chrome for Testing version
        id: cft
        run: |
          bun -e 'fetch("https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions-with-downloads.json").then((r) => r.json()).then((j) => console.log("version=" + j.channels.Stable.version))' >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"
      - name: Chrome for Testing cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.os == 'Windows' && '~/AppData/Local/tabcap/cache/chrome' || '~/.cache/tabcap/chrome' }}
          key: cft-${{ runner.os }}-${{ steps.cft.outputs.version }}
      - name: tabcap setup (default directories)
        run: |
          start=$(date +%s)
          bun src/cli/main.ts setup | tee setup.json
          echo "setup took $(( $(date +%s) - start )) s"
          bun -e 'Bun.file("setup.json").json().then((j) => { if (!j.ok) process.exit(1); console.log("TABCAP_CHROME=" + j.data.executablePath); })' >> "$GITHUB_ENV"
      # Linux runs headed Chrome under Xvfb, with a screen wider than Chrome's default window
      # (at most 1050 px wide at x=10), so Xvfb's pointer (screen centre) is not over the page
      # and sends no real mouse events. `display` is that prefix (nothing on Windows).
      - name: platform probe (listener, CDP channel, windows, file locations)
        if: matrix.shard == 1
        continue-on-error: true
        run: |
          display() { if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a -s "-screen 0 2560x1440x24" "$@"; else "$@"; fi; }
          display bun scripts/ci-probe.ts 2>&1 | tee probe.log
      # The wire component for this host (the e2e runs tabcap from source, which uses native/dist/).
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: wire binary (host)
        run: bun scripts/native.ts build --host
      # One throwaway browser before the tests (scripts/e2e-warmup.ts: daemon, browser,
      # a data: page, a screenshot, stop), so the shard's first file does not pay for a
      # cold runner (main run 39608432213: a paint stall 7 s after the first start).
      # The shard runs whatever the warm-up says.
      - name: e2e warm-up
        continue-on-error: true
        timeout-minutes: 3
        run: |
          display() { if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a -s "-screen 0 2560x1440x24" "$@"; else "$@"; fi; }
          display bun scripts/e2e-warmup.ts
      - name: L2 e2e
        env:
          # v04w copies the Chrome for Testing wire profile it captures here (uploaded below).
          TABCAP_WIRE_PROFILE_OUT: ${{ github.workspace }}/wire-profile
          E2E_ONLY: ${{ inputs.e2e_only }}
          E2E_REPEAT: ${{ inputs.e2e_repeat }}
        # Without TABCAP_CHROME (written by the setup step) every e2e file skips and bun
        # exits 0: refuse to start, and after the run scripts/e2e-summary.ts fails the
        # step when bun's summary says nothing passed.
        run: |
          if [ -z "${TABCAP_CHROME:-}" ]; then
            echo "::error::TABCAP_CHROME is empty: the setup step did not record Chrome for Testing, so every e2e file would skip"
            exit 1
          fi
          bun -e 'if (!require("node:fs").existsSync(process.env.TABCAP_CHROME)) { console.log(`::error::TABCAP_CHROME=${process.env.TABCAP_CHROME} does not exist`); process.exit(1); }'
          display() { if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a -s "-screen 0 2560x1440x24" "$@"; else "$@"; fi; }
          # What the runner is busy with, every 10 s, uploaded with the logs (scripts/ci-sampler.ts).
          bun scripts/ci-sampler.ts "$GITHUB_WORKSPACE/ci-logs/sampler.log" >/dev/null 2>&1 &
          sampler=$!
          trap 'kill $sampler 2>/dev/null || true' EXIT
          if [ -z "$E2E_ONLY" ]; then
            export TABCAP_LOG=info TABCAP_E2E_KEEP="$GITHUB_WORKSPACE/ci-logs/keep"
            files=$(bun scripts/e2e-shard.ts ${{ matrix.shard }}/3)
            echo "shard ${{ matrix.shard }}/3:" $files
            display bun test $files --timeout 120000 2>&1 | tee e2e.log
            bun scripts/e2e-summary.ts e2e.log
            exit
          fi
          export TABCAP_LOG=debug TABCAP_E2E_KEEP="$GITHUB_WORKSPACE/ci-logs/keep"
          failed=0
          for i in $(seq 1 "$E2E_REPEAT"); do
            echo "::group::$E2E_ONLY, run $i of $E2E_REPEAT"
            display bun test "$E2E_ONLY" --timeout 120000 2>&1 | tee -a e2e.log || failed=$((failed + 1))
            echo "::endgroup::"
          done
          echo "$failed of $E2E_REPEAT run(s) of $E2E_ONLY failed"
          bun scripts/e2e-summary.ts e2e.log
          [ "$failed" = 0 ]
      # Only the shard that ran v04w has one.
      - name: upload the captured wire profile
        if: always() && hashFiles('wire-profile/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: wire-profile-${{ matrix.os }}
          path: wire-profile
          if-no-files-found: warn
          retention-days: 30
      # upload-artifact takes one root: everything goes into ci-logs/ in the workspace first
      # (the default config dir is outside it: ~/.config/tabcap or %LOCALAPPDATA%\tabcap\config).
      - name: collect logs
        if: failure() || cancelled() || inputs.e2e_only
        run: |
          shopt -s nullglob
          mkdir -p ci-logs/config
          for f in e2e.log probe.log setup.json; do if [ -f "$f" ]; then cp "$f" ci-logs/; fi; done
          for d in "$HOME/.config/tabcap" "$HOME/AppData/Local/tabcap/config"; do
            for f in "$d"/*.log; do cp "$f" ci-logs/config/; done
          done
          find ci-logs -type f | sort
      - name: upload logs
        if: failure() || cancelled() || inputs.e2e_only
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-${{ matrix.os }}-${{ matrix.shard }}
          path: ci-logs/
          if-no-files-found: ignore
          retention-days: 7
